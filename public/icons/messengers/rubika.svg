<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Rounded White Squircle Container -->
  <rect width="200" height="200" rx="44" fill="#FFFFFF" />
  
  <g transform="translate(0,0)">
    <!-- Facet 1: Top Left Lime Green -->
    <polygon points="100,20 100,60 62,38" fill="#8CBD1B" />
    <polygon points="100,20 62,38 30,60" fill="#E67E22" />
    <polygon points="30,60 65,95 30,100" fill="#D35400" />
    
    <!-- Facet 2: Top Center Green -->
    <polygon points="100,20 138,38 100,60" fill="#7CB342" />
    <polygon points="138,38 170,60 100,60" fill="#26A69A" />
    <polygon points="170,60 170,100 135,95" fill="#1E88E5" />

    <!-- Facet 3: Right Side Purple & Magenta -->
    <polygon points="170,100 170,140 135,138" fill="#5E35B1" />
    <polygon points="170,140 135,138 170,140" fill="#3949AB" />
    <polygon points="170,140 135,138 100,180" fill="#E53935" />
    <polygon points="170,100 135,95 135,138" fill="#3F51B5" />

    <!-- Facet 4: Bottom Orange & Yellow -->
    <polygon points="100,180 135,138 100,158" fill="#FB8C00" />
    <polygon points="100,180 100,158 65,138" fill="#C0CA33" />
    <polygon points="100,180 65,138 30,140" fill="#7CB342" />

    <!-- Facet 5: Left Side Blue & Cyan -->
    <polygon points="30,140 65,138 65,95" fill="#00897B" />
    <polygon points="30,140 65,95 30,100" fill="#039BE5" />
    <polygon points="30,100 65,95 30,60" fill="#4527A0" />

    <!-- Facet Outer Hexagon Colors precise matching uploaded logo -->
    <!-- Top-Left Orange -->
    <polygon points="30,60 100,20 65,95" fill="#E65100" />
    <!-- Top Lime -->
    <polygon points="100,20 138,38 100,60" fill="#8BC34A" />
    <polygon points="138,38 170,60 135,95" fill="#00ACC1" />
    <!-- Right Purple -->
    <polygon points="170,60 170,100 135,95" fill="#5E35B1" />
    <polygon points="170,100 170,140 135,138" fill="#E53935" />
    <!-- Bottom Right Orange -->
    <polygon points="170,140 100,180 135,138" fill="#FB8C00" />
    <!-- Bottom Green -->
    <polygon points="100,180 30,140 65,138" fill="#9E9D24" />
    <!-- Left Cyan -->
    <polygon points="30,140 30,100 65,95" fill="#00ACC1" />
    <!-- Left Dark Blue -->
    <polygon points="30,100 30,60 65,95" fill="#1565C0" />

    <!-- Central White Isometric 3D Cube -->
    <!-- Top Face (Lightest) -->
    <polygon points="100,60 135,95 100,115 65,95" fill="#FFFFFF" />
    <!-- Right Face (Medium Shadow) -->
    <polygon points="100,115 135,95 135,138 100,158" fill="#F0F0F0" />
    <!-- Left Face (Darker Shadow) -->
    <polygon points="100,115 65,95 65,138 100,158" fill="#E0E0E0" />
  </g>
</svg>
